<!DOCTYPE html>
<html>
<head>
    <title>WoofwoofOS is starting...</title>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }

        #woof {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>
    <div id="woof">
    <img src="IMG_0744.jpeg" alt="WoofwoofOS Logo" style="width: 200px; height: auto; margin-top: 50px;">
    <h1>WoofwoofOS</h1>
    <p id="starting-text">WoofwoofOS is starting</p>
    </div>
    <script>
        setInterval(() => {
            const startingText = document.getElementById('starting-text');
            if (startingText.innerText === 'WoofwoofOS is starting') {
                startingText.innerText = 'WoofwoofOS is starting.';
            } else if (startingText.innerText === 'WoofwoofOS is starting.') {
                startingText.innerText = 'WoofwoofOS is starting..';
            } else if (startingText.innerText === 'WoofwoofOS is starting..') {
                startingText.innerText = 'WoofwoofOS is starting...';
            } else {
                startingText.innerText = 'WoofwoofOS is starting';
            }
        }, 500);

        // Randomized boot time, 10-20 seconds
        const bootTime = Math.floor(Math.random() * 10000) + 10000;
        setTimeout (() => {
            window.location.href = 'main.html';
        }, bootTime);
    </script>
</body>
</html>
