<!DOCTYPE html>
<html>
<head>
    <title>Game Launcher</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: darkslategray;
            color: white;
        }

        .game-tile {
            display: inline-block;
            width: 200px;
            height: 200px;
            margin: 20px;
            background-color: #4CAF50;
            border-radius: 10px;
            cursor: pointer;
            color: aquamarine;
        }
    </style>
</head>
<body>
    <h1>Game Launcher</h1>
    <div class="game-tile" onclick="launchGame('/games/guess-the-number.html')">
        <h2>Guess<br>the Number</h2>
    </div>
    <div class="game-tile" onclick="launchGame('/games/GingerClicker.html')">
        <h2>Ginger<br>Clicker</h2>
    </div>
    <script>
        function launchGame(gameUrl) {
            window.location.href = gameUrl;
        }
    </script>
</body>
</html>
