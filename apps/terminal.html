<!DOCTYPE html>
<html>
<head>
    <title>Terminal for WoofwoofOS</title>
    <style>
        body {
            font-family: monospace;
            background-color: black;
            color: white;
            margin: 0;
            padding: 10px;
        }
        #terminalOutput {
            white-space: pre-wrap;
        }
        .input-line {
            display: flex;
        }
        .prompt {
            white-space: nowrap;
            padding-right: 5px;
        }
        #commandInput {
            flex-grow: 1;
            background-color: black;
            color: white;
            border: none;
            outline: none;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div id="terminalOutput"></div>
    <div class="input-line">
        <span class="prompt">WoofwoofOS&gt; </span>
        <input type="text" id="commandInput" autofocus>
    </div>

    <script>
        const commandInput = document.getElementById('commandInput');
        const terminalOutput = document.getElementById('terminalOutput');
        terminalOutput.textContent = 'Welcome to the WoofwoofOS Terminal. Type any JavaScript here.\n';

        commandInput.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                const command = commandInput.value;
                commandInput.value = '';

                terminalOutput.textContent += 'WoofwoofOS> ' + command + '\n';
                
                try {
                    let cmdResult = new Function(command)();
                        terminalOutput.textContent += cmdResult + '\n';
                } catch (error) {
                    terminalOutput.textContent += error + '\n';
                }
            }
        });
    </script>
</body>
</html>
